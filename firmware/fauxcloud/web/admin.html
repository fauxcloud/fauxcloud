<!doctype html>
<html lang="en" class="f-admin" data-page="00000000">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-t="admin.title">fauxcloud settings</title>
<!-- the admin face: this shell, then app-admin.css and admin.js (hashed, cached for a year); STA side only -->
<script>try{var t=localStorage.getItem('fc-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<!-- critical paint before the stylesheets land, on body and never on html (an html background stops body's from reaching the canvas, and then body paints over the fixed .sky layer); one line, so the shell ships without it -->
<style>
body{background:#14366a;color:#f3f5fb}html{color-scheme:dark}
html[data-theme="light"] body{background:#a9cbf6;color:#0e1a33}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
</style>
<link rel="stylesheet" href="/*@asset app-admin.css*/">
<link rel="icon" type="image/svg+xml" href="/*@asset favicon.svg*/">
<link rel="apple-touch-icon" href="/*@asset touch-icon.png*/">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14366a">
<script src="/*@asset admin.js*/" defer></script>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div id="app"><div class="wrap"><p class="lead" data-t="admin.loading">Loading…</p></div></div>
<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shTitle" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <header><span id="shIcon"></span><h2 id="shTitle"></h2><button type="button" class="x" id="shClose" aria-label="Close" data-tl="admin.close"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M3.5 3.5l9 9m0-9l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button></header>
  <div class="body" id="shBody"></div>
  <footer id="shFoot"><span class="msg" id="shMsg" role="status"></span><button type="button" class="btn quiet" id="shCancel" data-t="admin.cancel">Cancel</button><button type="button" class="btn primary" id="shSave" data-t="admin.save">Save</button></footer>
</section>
<div class="toast" id="toast" role="status" hidden></div>
<noscript><p>This page needs JavaScript.</p></noscript>
</body>
</html>
