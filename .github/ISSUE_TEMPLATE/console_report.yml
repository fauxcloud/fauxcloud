name: Console report
description: Tell us how fauxcloud works with a weather console that is not on the list yet.
title: "Console report: <brand> <model>"
labels: ["console-report"]
body:
  - type: markdown
    attributes:
      value: |
        A short report is enough, and it is how a console model gets checked. The steps, with pictures, are in
        [Report a console](https://fauxcloud.org/docs/report-a-console/): in fauxcloud's Settings, open
        **fauxcloud Wi-Fi for your station**, then **Listen to a new console**, connect the console, then Copy the
        report and paste it below. Listening needs fauxcloud 1.1 or later (Settings → Maintenance shows the version).

        If your console's setup page has a Weather Underground box, it may work; nothing beyond the verified console
        has been tested yet. A console that pairs only through an app has no setup page to point at fauxcloud, so it
        most likely will not; a report still helps.

        Never send passwords, keys, the crash file (it contains your passwords) or the exact location of your station.
  - type: input
    id: model
    attributes:
      label: Brand and model
      description: As printed on the console and on the box. Add other names you have seen it sold under.
      placeholder: "Brand, model number (for example YT60234)"
    validations:
      required: true
  - type: input
    id: bought
    attributes:
      label: Where you bought it
      description: The country and the kind of shop is enough.
      placeholder: Germany, online marketplace, 2026
  - type: dropdown
    id: upload
    attributes:
      label: What upload settings does the console's setup page have?
      options:
        - A Weather Underground box (station ID and key)
        - A custom server (host, port, path)
        - Both
        - None, it pairs only through an app
        - I could not open the setup page
        - Something else (describe below)
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: |
        Paste the report from **Listen to a new console** (Copy, or the downloaded file). Read it first and delete
        anything that is yours: fauxcloud hides the values it recognises as IDs, keys and passwords, but it cannot know
        every field name. A console that already uploads: paste the last lines of its station's **Console** tab instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: setup
    attributes:
      label: The setup page
      description: |
        How you opened it (which button, which network the console opened). Which boxes does it have: Wi-Fi, Weather
        Underground, Weathercloud, a custom server, a time server, others? For a custom server, what did host, port and
        path say before you changed them?
  - type: input
    id: firmware
    attributes:
      label: Console firmware version
      description: Shown on the console's setup page, if it shows one.
  - type: input
    id: version
    attributes:
      label: fauxcloud version
      description: Settings → Maintenance shows it. The Listen report carries it in its first line already.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: |
        What worked and what did not, a field with a strange value, the region and frequency of the outdoor sensor
        (for example 868 MHz in the EU), and anything odd.
  - type: textarea
    id: photos
    attributes:
      label: Photos
      description: |
        Drop in a photo of the label on the back of the console (cover any MAC address or serial number on it), and
        one of its setup page. Cover your Wi-Fi name and password.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send it
      options:
        - label: I read the report. It contains no password, key, crash file or exact location.
          required: true
        - label: The console's lines from this report may be used in the project's console list and tests.
          required: true
        - label: Credit me by my GitHub handle in the console list.
