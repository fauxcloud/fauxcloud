# The site (landing, docs, /install/, the /try/ demo) built from main and deployed to GitHub Pages: the installer's
# version list from the published releases -> build -> leak gate on the built folder -> deploy. After publishing a
# release, run this workflow by hand on main (Actions -> pages -> Run workflow) so /install/ offers it: a run started
# by the release itself would sit on the tag, which the github-pages environment does not deploy from.
# SWITCHED OFF until the site exists and the repository is public: every job runs only when the repository variable
# PAGES_ENABLED is "true" (Settings -> Secrets and variables -> Actions -> Variables), and Pages itself must be set to
# "GitHub Actions" as its source. Without the variable a run is skipped, never failed.
# Third-party actions are pinned by commit, the tag in the comment.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      # the site build runs the web asset generator: terser through node, zopfli from tools/.pylib (as build.yml)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      - name: Pinned generator tools (terser), no install scripts
        run: npm ci --ignore-scripts
        working-directory: tools
      - name: Pinned generator tools (zopfli), hashes required
        run: |
          python -m pip install --require-hashes --only-binary :all: --target tools/.pylib -r tools/requirements.txt
      # the installer's version list from the published releases: versions.json lists each factory zip at a same-origin
      # path, /firmware/<version>/, so the installer never downloads cross-origin; the zips themselves (checked against
      # their SHA-256) wait in $RUNNER_TEMP/firmware and join the build after the leak gate (below)
      - name: The installer's versions (site/firmware/versions.json; the release zips aside)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/releases?per_page=30" > "$RUNNER_TEMP/releases.json"
          python -I tools/site_versions.py --releases "$RUNNER_TEMP/releases.json" --mirror "$RUNNER_TEMP/firmware"
      - name: Build the site (site/_build)
        run: python -I tools/build_site.py
      - name: Leak gate on the built site (deny-list required)
        env:
          LEAKGATE_DENY: ${{ secrets.LEAKGATE_DENY }}
        run: |
          [ -n "$LEAKGATE_DENY" ] || { echo "::error::a site deploy needs the private deny-list (secret LEAKGATE_DENY)"; exit 1; }
          python -I tools/leakgate.py --tree site/_build --strict-tags --github --summary-only \
            || { echo "::error::LEAK GATE FAILED on the built site"; exit 1; }
      # the factory zips are release assets: the release workflow's leak gate scanned every part inside them (unpacked),
      # so they join the built site only after the site's own gate, which reads a zip as an unknown binary.
      # Order: versions -> build -> leak gate -> the zips join -> the full check of what is uploaded -> deploy.
      - name: The release zips into the build (/firmware/<version>/)
        run: |
          mkdir -p "$RUNNER_TEMP/firmware"
          cp -r "$RUNNER_TEMP/firmware/." site/_build/firmware/
      # the site check on the folder that is uploaded: the demo's bytes, links, words, budgets, and every versions.json
      # row against the zip actually served (present, size, SHA-256); the folder must equal the checked build exactly
      - name: Check the built site as it will be served
        run: python -I tools/build_site.py --check --firmware-extra "$RUNNER_TEMP/firmware" --served site/_build
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      # v3 archives dot folders (it excludes only .git and .github), so /.well-known/security.txt is served; check
      # that a newer major still includes them before bumping it
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site/_build

  deploy:
    needs: build
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
